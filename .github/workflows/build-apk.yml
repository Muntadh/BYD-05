name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [arabic]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Arabic voice tests
        run: ./gradlew :app:testDebugUnitTest --tests "com.bydmate.app.voice.ArabicVoiceTest" --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BYDMate-arabic-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arabic-latest
          name: BYD 05 (Arabic) - latest build
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
